name: Deploy Production Backend to Hostinger VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKERHUB_REPOSITORY: lanek/abma-backend
  PROJECT_PATH: /home/deployer/proyectos/abma/prod/back
  COMPOSE_PROJECT: abma_prod

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build, tag and push image
        run: |
          COMMIT_TAG=${{ github.sha }}
          docker build -t "$DOCKERHUB_REPOSITORY:prod-$COMMIT_TAG" -t "$DOCKERHUB_REPOSITORY:latest" .
          docker push "$DOCKERHUB_REPOSITORY:prod-$COMMIT_TAG"
          docker push "$DOCKERHUB_REPOSITORY:latest"

      - name: Upload files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'docker-compose.yml'
          target: ${{ env.PROJECT_PATH }}/
          strip_components: 0
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOCKERHUB_REPOSITORY,PROJECT_PATH,COMPOSE_PROJECT
          script: |
            set -e
            echo "=== Preparando entorno ==="
            mkdir -p $PROJECT_PATH/public
            cd $PROJECT_PATH

            echo "DOCKERHUB_REPOSITORY=$DOCKERHUB_REPOSITORY" > .env
            # Heredoc con delimitador entre comillas: el secret se escribe tal
            # cual. Con echo "..." bash ejecutaba las `comillas invertidas` y
            # expandía los $ de los valores (contraseñas incluidas).
            cat >> .env <<'ABMA_ENV_EOF'
            ${{ secrets.PROD_ENV_VARS }}
            ABMA_ENV_EOF
            chmod 600 .env

            # Solo se leen las variables que usa este script. Cargar el .env
            # entero con `source` fallaba con valores con espacios sin comillas
            # (p. ej. un App Password de Gmail); docker compose sí los admite.
            env_get() { grep -E "^$1=" .env | tail -n1 | cut -d= -f2- | sed -E "s/^[\"']//; s/[\"']$//"; }
            POSTGRES_USER=$(env_get POSTGRES_USER)
            DB_NAME=$(env_get DB_NAME)

            # El backend corre como uid 1001 (usuario nestjs)
            sudo chown -R 1001:1001 public || chown -R 1001:1001 public || true

            echo "=== Descargando imagen ==="
            for i in 1 2 3; do
              docker pull "$DOCKERHUB_REPOSITORY:latest" && break
              echo "Intento $i falló, reintentando en 10s..."; sleep 10
              [ $i -eq 3 ] && { echo "No se pudo descargar la imagen"; exit 1; }
            done

            echo "=== Levantando base de datos ==="
            docker compose up -d db redis

            echo "Esperando a que PostgreSQL acepte conexiones..."
            for i in $(seq 1 30); do
              docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$DB_NAME" && break
              sleep 2
              [ $i -eq 30 ] && { echo "PostgreSQL no respondió"; exit 1; }
            done

            echo "=== Migraciones Prisma ==="
            # Baseline idempotente: si la BD ya tiene tablas pero no _prisma_migrations
            # (p. ej. restaurada de un dump), marca la primera migración como aplicada
            # para evitar el error P3005.
            HAS_TABLES=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$DB_NAME" -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")
            HAS_MIGRATIONS=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$DB_NAME" -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='_prisma_migrations';")

            if [ "$HAS_TABLES" -gt 0 ] && [ "$HAS_MIGRATIONS" -eq 0 ]; then
              FIRST_MIGRATION=$(docker compose run --rm --no-deps --entrypoint sh backend \
                -c "ls -1 prisma/migrations | grep -v migration_lock | head -n1" | tr -d '\r')
              echo "BD existente sin historial de migraciones. Baseline en: $FIRST_MIGRATION"
              docker compose run --rm --no-deps --entrypoint sh backend \
                -c "npx prisma migrate resolve --applied $FIRST_MIGRATION"
            fi

            docker compose run --rm --no-deps --entrypoint sh backend \
              -c "npx prisma migrate deploy"

            echo "=== Levantando backend ==="
            docker compose up -d
            docker compose ps

            echo "=== Deploy completado ==="
